backtest.hint=Daily bar engine in the shape of vn.py and backtrader. The strategy sees one bar at a time. Orders fill A-share lots of 100 shares at the close. Commission is 0.03 percent with a 5 yuan minimum, and sells pay 0.05 percent stamp tax. Buy and hold enters on the first bar. MA cross buys when the 5-day average crosses above the 20-day average and sells on the cross down. Turtle breakout buys a close above the prior 20-day high and sells a close below the prior 10-day low. Starting cash is 100,000 yuan. Results are a historical simulation.
