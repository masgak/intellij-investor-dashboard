screen.hint.tang=Ratio is market cap divided by the buy-point cap. Below 1 is the buy zone. Hover a row for industry, price, and valuation. Rules follow the Value Investing Handbook: five annual reports with ROE at least 15, gross margin at least 40, and positive earnings. Average cash flow per share at least half of EPS. Debt under 60. Market cap at least 10 billion yuan. Fair PE is 25 (20 when cash conversion is below 1). Debt at or above 40 cuts the value to 70 percent. The buy point is half of fair value three years out. Banks, insurers, brokers, property, and commodity cyclicals are excluded.
screen.hint.graham=Borrowed from the securities-screener reading of The Intelligent Investor: PE times PB is at most 22.5. PE at most 15 and PB at most 1.5 is the buy zone. Debt under 50, market cap at least 5 billion yuan, five years of positive earnings. A reported dividend yield must be positive. Financials, property, and commodity cyclicals are excluded.
screen.hint.magic=Borrowed from Greenblatt and the magic-formula screeners: rank by earnings yield (1/PE) and by ROE, add the ranks, and keep the best 30. The first 10 are the buy zone. Financials, utilities, property, and commodity cyclicals are excluded. Debt under 60. Market cap at least 5 billion yuan. ROE stands in for return on capital.
screen.hint.quality=Borrowed from investool: five years of ROE at least 8, growing profit and revenue, debt under 60, market cap at least 10 billion yuan. The list keeps the 40 fastest profit growers. PE under 20 is the buy zone, under 35 is hold.
