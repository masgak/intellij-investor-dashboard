screen.hint.tang=买点比 = 当前市值 / 理想买点市值，小于 1 就是理想买点。鼠标停在某一行上可以看行业、现价和估值。规则来自《价值投资实战手册》：连续 5 年年报 ROE 不低于 15%、毛利率不低于 40%、利润为正；五年平均净现比不低于 0.5；资产负债率低于 60%；总市值不低于 100 亿。无风险收益率按 4%，合理市盈率 25 倍，净现比不足 1 时改为 20 倍。负债率达到 40% 时，合理估值打七折。理想买点是三年后合理估值的一半。银行、保险、证券、房地产和强周期行业排除。
screen.hint.graham=借鉴 GitHub 上 securities-screener 对《聪明的投资者》的量化：PE×PB 不超过 22.5，市盈率不超过 15 且市净率不超过 1.5 标为买点，其余通过者标为持有。负债率低于 50%，总市值不低于 50 亿，连续 5 年利润为正。有股息率数据时要求大于 0。金融、地产和强周期行业排除。
screen.hint.magic=借鉴 Greenblatt 神奇公式和 GitHub 上的 magic-formula-screener：用盈利收益率（1/市盈率）和 ROE 分别排名，名次相加后取得分最低的 30 只。前 10 名标为买点。排除金融、公用事业、地产和强周期，负债率低于 60%，总市值不低于 50 亿。这里用 ROE 代替原书的投入资本回报率。
screen.hint.quality=借鉴 GitHub 上 investool 的基本面过滤：连续 5 年 ROE 不低于 8%，净利润和营收都在增长，负债率低于 60%，总市值不低于 100 亿。按净利润三年复合增速取前 40 只。市盈率低于 20 标为买点，低于 35 标为持有。
