backtest.hint=这是按 vn.py / backtrader 的方式写的日线回测：行情一根根推进，策略只看当前 K 线，账户按 A 股 100 股一手成交。手续费万三、最低 5 元，卖出另收万五印花税，按收盘价成交。买入持有是第一天满仓。均线交叉是 5 日上穿 20 日买入、下穿卖出。海龟突破是收盘价突破前 20 日最高价买入，跌破前 10 日最低价卖出。初始资金 10 万元。结果是历史模拟，不是未来收益。
